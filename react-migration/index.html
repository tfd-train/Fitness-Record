<style>
  /* 懸浮「返回平台」按鈕 */
  .tfd-back {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 1500; display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 14px 6px 10px; border-radius: 999px;
    background: rgba(15, 23, 42, 0.88); color: #fff; font-size: 13px; font-weight: 700; line-height: 1;
    text-decoration: none; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .15s, box-shadow .15s;
  }
  .tfd-back:hover { background: rgba(15, 23, 42, 1); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }
  .tfd-back svg { width: 16px; height: 16px; }
  @media (max-width: 767px) { .tfd-back { font-size: 12px; padding: 8px 12px 8px 9px; top: auto; bottom: calc(14px + env(safe-area-inset-bottom)); left: 12px; transform: none; } }
  @media print { .tfd-back { display: none !important; } }
</style>
</head>
  <body>
<a class="tfd-back" href="https://tfd-train.github.io/Training-Management-Platform/" title="返回訓練管理整合平台">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回平台
</a>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  
<script>
  // PWA：註冊 Service Worker（可加到主畫面、離線開啟）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
